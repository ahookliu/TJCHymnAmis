        function getSongDriveIds(song) {
            if (!song) return [];
            if (Array.isArray(song.driveIds)) return song.driveIds;
            if (song.driveId) return [song.driveId];
            return [];
        }

        function getImageUrl(songNum, pageIndex = 0) {
            const key = `${songNum}_${pageIndex}`;
            if (state.customUrls[key]) {
                return state.customUrls[key];
            } else if (pageIndex === 0 && state.customUrls[songNum]) {
                return state.customUrls[songNum];
            }

            const song = songsData.find(s => s.num === songNum);
            const ids = getSongDriveIds(song);
            const driveId = ids[pageIndex] || ids[0];
            
            if (driveId && !driveId.startsWith('GOOGLE_DRIVE_FILE_ID_')) {
                return `https://lh3.googleusercontent.com/d/${driveId}`;
            }

            const title = song ? song.title : '';
            return `https://placehold.co/800x1100/161b22/a855f7?text=A-${songNum}+${encodeURIComponent(title)}+(P.${pageIndex + 1})\n\n[+Google+Drive+ID:+${driveId || 'N/A'}+]`;
        }

        function renderSongList() {
            elements.songContainer.innerHTML = '';
            
            const filtered = songsData.filter(song => {
                const matchesSearch = song.num.toString().includes(state.searchQuery) || 
                                      song.title.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesTab = state.activeTab === 'all' || state.favorites.has(song.num);
                return matchesSearch && matchesTab;
            });

            if (filtered.length === 0) {
                elements.songContainer.innerHTML = `
                    <div class="text-center py-10 text-gray-500 text-xs">
                        <i class="fa-solid fa-music-slash text-2xl mb-2 text-gray-600"></i>
                        <p>未找到相關詩歌</p>
                    </div>
                `;
                return;
            }

            if (state.viewMode === 'grid') {
                elements.songContainer.className = 'flex-1 overflow-y-auto p-2 grid grid-cols-3 gap-1.5 align-content-start';
            } else {
                elements.songContainer.className = 'flex-1 overflow-y-auto p-2 space-y-1';
            }

            filtered.forEach(song => {
                const isSelected = song.num === state.currentNum;
                const isFav = state.favorites.has(song.num);

                const item = document.createElement('div');

                if (state.viewMode === 'list') {
                    item.className = `group flex items-center justify-between p-2 rounded-lg cursor-pointer transition-all duration-150 ${
                        isSelected 
                            ? 'bg-brand-purple/20 border border-brand-purple/50 text-white font-medium shadow-sm' 
                            : 'hover:bg-dark-hover text-gray-300 border border-transparent'
                    }`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-2.5 truncate">
                            <span class="px-2 py-0.5 rounded text-[11px] font-mono font-bold ${
                                isSelected ? 'bg-brand-purple text-white' : 'bg-dark-bg text-gray-400 group-hover:text-gray-200'
                            }">${song.num}</span>
                            <span class="text-xs truncate">${song.title}</span>
                        </div>
                        <button class="fav-btn p-1 text-gray-500 hover:text-amber-400 transition ml-1" data-num="${song.num}">
                            <i class="${isFav ? 'fa-solid fa-bookmark text-amber-400' : 'fa-regular fa-bookmark'} text-xs"></i>
                        </button>
                    `;
                } else {
                    item.className = `flex flex-col items-center justify-center p-2 rounded-lg cursor-pointer transition-all border ${
                        isSelected 
                            ? 'bg-brand-purple/20 border-brand-purple text-white font-bold' 
                            : 'bg-dark-bg border-dark-border hover:bg-dark-hover text-gray-300'
                    }`;
                    item.innerHTML = `
                        <span class="text-xs font-mono font-bold mb-0.5">${song.num}</span>
                        <span class="text-[10px] text-gray-400 truncate w-full text-center">${song.title.split(' ')[0]}</span>
                    `;
                }

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-btn')) {
                        e.stopPropagation();
                        toggleFavorite(song.num);
                    } else {
                        selectSong(song.num, 0);
                        if (window.innerWidth < 1024) {
                            closeSidebar();
                        }
                    }
                });

                elements.songContainer.appendChild(item);
            });

            elements.countFav.textContent = state.favorites.size;
            elements.countAll.textContent = songsData.length;
            elements.totalSongs.textContent = filtered.length;
        }

        function selectSong(num, pageIndex = 0) {
            state.currentNum = num;
            state.currentPageIndex = pageIndex;

            window.location.hash = `#${num}`;

            const song = songsData.find(s => s.num === num);
            if (!song) return;

            document.title = `第 ${song.num} 首 - ${song.title} | 真耶穌教會阿美語詩歌`;

            const ids = getSongDriveIds(song);
            const totalPages = Math.max(1, ids.length);

            if (state.currentPageIndex >= totalPages) state.currentPageIndex = totalPages - 1;
            if (state.currentPageIndex < 0) state.currentPageIndex = 0;

            elements.currentBadge.textContent = `A-${song.num}`;
            elements.currentTitle.textContent = song.title;
            elements.mobileCurrentTitle.textContent = `${song.num} ${song.title}`;

            if (totalPages > 1) {
                elements.pageSwitcherContainer.classList.remove('hidden');

                if (state.currentPageIndex > 0) {
                    elements.floatPrevPage.classList.remove('hidden');
                } else {
                    elements.floatPrevPage.classList.add('hidden');
                }

                if (state.currentPageIndex < totalPages - 1) {
                    elements.floatNextPage.classList.remove('hidden');
                } else {
                    elements.floatNextPage.classList.add('hidden');
                }

                elements.pageButtons.innerHTML = '';
                for (let i = 0; i < totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = `px-2 py-0.5 rounded text-xs font-mono transition ${
                        i === state.currentPageIndex
                            ? 'bg-brand-purple text-white font-bold shadow-sm'
                            : 'text-gray-400 hover:text-white hover:bg-dark-hover'
                    }`;
                    btn.textContent = `頁 ${i + 1}`;
                    btn.addEventListener('click', () => selectSong(num, i));
                    elements.pageButtons.appendChild(btn);
                }
            } else {
                elements.pageSwitcherContainer.classList.add('hidden');
                elements.floatPrevPage.classList.add('hidden');
                elements.floatNextPage.classList.add('hidden');
            }

            if (state.favorites.has(num)) {
                elements.iconFavMain.className = 'fa-solid fa-bookmark text-amber-400';
            } else {
                elements.iconFavMain.className = 'fa-regular fa-bookmark';
            }

            elements.loadingSpinner.classList.remove('hidden');
            const imgUrl = getImageUrl(num, state.currentPageIndex);

            const tempImg = new Image();
            tempImg.onload = () => {
                elements.scoreImg.src = imgUrl;
                elements.loadingSpinner.classList.add('hidden');
            };
            tempImg.onerror = () => {
                elements.scoreImg.src = `https://placehold.co/800x1100/161b22/ef4444?text=A-${num}+${encodeURIComponent(song.title)}+(P.${state.currentPageIndex + 1})\n\n[+圖片載入失敗+]`;
                elements.loadingSpinner.classList.add('hidden');
            };
            tempImg.src = imgUrl;

            updateTransform();
            renderSongList();
        }

        function toggleFavorite(num) {
            if (state.favorites.has(num)) {
                state.favorites.delete(num);
            } else {
                state.favorites.add(num);
            }
            localStorage.setItem('amis_favs', JSON.stringify(Array.from(state.favorites)));
            
            if (num === state.currentNum) {
                if (state.favorites.has(num)) {
                    elements.iconFavMain.className = 'fa-solid fa-bookmark text-amber-400';
                } else {
                    elements.iconFavMain.className = 'fa-regular fa-bookmark';
                }
            }
            renderSongList();
        }

        function shareCurrentSong() {
            const baseUrl = "https://ahookliu.github.io/TJCHymnAmis";
            const fullUrl = `${baseUrl}/#${state.currentNum}`;
            
            navigator.clipboard.writeText(fullUrl).then(() => {
                showToast();
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = fullUrl;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    alert("複製網址失敗：" + fullUrl);
                }
                document.body.removeChild(textArea);
            });
        }

        function showToast() {
            const toast = elements.toastNotification;
            toast.textContent = `已複製第 ${state.currentNum} 首完整網址！`;
            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 2500);
        }

        function navigateSong(delta) {
            const newNum = state.currentNum + delta;
            if (newNum >= 311 && newNum <= 411) {
                selectSong(newNum, 0);
            }
        }

        function switchPage(delta) {
            const song = songsData.find(s => s.num === state.currentNum);
            const ids = getSongDriveIds(song);
            if (ids.length > 1) {
                const newPageIndex = state.currentPageIndex + delta;
                if (newPageIndex >= 0 && newPageIndex < ids.length) {
                    selectSong(state.currentNum, newPageIndex);
                }
            }
        }

        function updateTransform() {
            elements.zoomLevel.textContent = `${Math.round(state.zoom * 100)}%`;
            elements.imgContainer.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
        }

        function zoom(delta) {
            state.zoom = Math.min(Math.max(0.5, state.zoom + delta), 4);
            updateTransform();
        }

        function resetZoom() {
            state.zoom = 1;
            state.panX = 0;
            state.panY = 0;
            updateTransform();
        }

        // 自動嘗試進入全螢幕隱藏瀏覽器網址列與工具列
        function triggerFullScreen() {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        // 點擊頁面或圖片時自動隱藏/顯示 UI 並且順便嘗試隱藏網址列
        document.addEventListener('click', () => {
            triggerFullScreen();
        }, { once: true });

        elements.scoreImg.addEventListener('click', (e) => {
            e.stopPropagation();
            state.uiHidden = !state.uiHidden;
            if (state.uiHidden) {
                elements.appBody.classList.add('hide-ui');
                closeSidebar();
            } else {
                elements.appBody.classList.remove('hide-ui');
            }
        });

        // 桌面端滑鼠拖曳平移
        elements.viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('#url-modal') || e.target.closest('button')) return;
            state.isDragging = true;
            state.dragStart = { x: e.clientX - state.panX, y: e.clientY - state.panY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.isDragging) return;
            state.panX = e.clientX - state.dragStart.x;
            state.panY = e.clientY - state.dragStart.y;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            state.isDragging = false;
        });

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        elements.viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('button') || e.target.closest('#url-modal')) return;
            
            if (e.touches.length === 1) {
                state.isDragging = true;
                state.dragStart = { x: e.touches[0].clientX - state.panX, y: e.touches[0].clientY - state.panY };
                state.initialPinchDistance = null;
            } else if (e.touches.length === 2) {
                state.isDragging = false;
                state.initialPinchDistance = getTouchDistance(e.touches);
                state.initialZoom = state.zoom;
            }
        }, { passive: false });

        elements.viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && state.isDragging) {
                state.panX = e.touches[0].clientX - state.dragStart.x;
                state.panY = e.touches[0].clientY - state.dragStart.y;
                updateTransform();
            } else if (e.touches.length === 2 && state.initialPinchDistance) {
                const currentDistance = getTouchDistance(e.touches);
                const scaleFactor = currentDistance / state.initialPinchDistance;
                state.zoom = Math.min(Math.max(0.5, state.initialZoom * scaleFactor), 4);
                updateTransform();
            }
        }, { passive: false });

        elements.viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                state.initialPinchDistance = null;
            }
            if (e.touches.length === 0) {
                state.isDragging = false;
            }
        });

        function openSidebar() {
            elements.sidebar.classList.remove('-translate-x-full');
            elements.sidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            elements.sidebar.classList.add('-translate-x-full');
            elements.sidebarOverlay.classList.add('hidden');
        }

        elements.toggleSidebar.addEventListener('click', openSidebar);
        elements.closeSidebar.addEventListener('click', closeSidebar);
        elements.sidebarOverlay.addEventListener('click', closeSidebar);

        elements.btnPrev.addEventListener('click', () => navigateSong(-1));
        elements.btnNext.addEventListener('click', () => navigateSong(1));

        elements.floatPrevPage.addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage(-1);
        });
        elements.floatNextPage.addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage(1);
        });

        elements.btnZoomIn.addEventListener('click', () => zoom(0.2));
        elements.btnZoomOut.addEventListener('click', () => zoom(-0.2));
        elements.btnZoomReset.addEventListener('click', resetZoom);

        elements.btnToggleFav.addEventListener('click', () => toggleFavorite(state.currentNum));
        elements.btnShare.addEventListener('click', shareCurrentSong);

        elements.searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value.trim();
            elements.clearSearch.classList.toggle('hidden', state.searchQuery === '');
            renderSongList();
        });

        elements.clearSearch.addEventListener('click', () => {
            elements.searchInput.value = '';
            state.searchQuery = '';
            elements.clearSearch.classList.add('hidden');
            renderSongList();
        });

        elements.tabAll.addEventListener('click', () => {
            state.activeTab = 'all';
            elements.tabAll.className = 'px-2.5 py-1 rounded-md bg-dark-card font-medium text-white shadow-sm transition-all text-[11px]';
            elements.tabFav.className = 'px-2.5 py-1 rounded-md text-gray-400 hover:text-gray-200 font-medium transition-all text-[11px]';
            renderSongList();
        });

        elements.tabFav.addEventListener('click', () => {
            state.activeTab = 'fav';
            elements.tabFav.className = 'px-2.5 py-1 rounded-md bg-dark-card font-medium text-white shadow-sm transition-all text-[11px]';
            elements.tabAll.className = 'px-2.5 py-1 rounded-md text-gray-400 hover:text-gray-200 font-medium transition-all text-[11px]';
            renderSongList();
        });

        elements.viewList.addEventListener('click', () => {
            state.viewMode = 'list';
            elements.viewList.className = 'p-1 px-1.5 text-brand-purple rounded bg-dark-card shadow-sm text-xs';
            elements.viewGrid.className = 'p-1 px-1.5 text-gray-400 hover:text-gray-200 rounded text-xs';
            renderSongList();
        });

        elements.viewGrid.addEventListener('click', () => {
            state.viewMode = 'grid';
            elements.viewGrid.className = 'p-1 px-1.5 text-brand-purple rounded bg-dark-card shadow-sm text-xs';
            elements.viewList.className = 'p-1 px-1.5 text-gray-400 hover:text-gray-200 rounded text-xs';
            renderSongList();
        });

        elements.btnCustomUrl.addEventListener('click', () => {
            elements.modalSongNum.textContent = `${state.currentNum} (頁 ${state.currentPageIndex + 1})`;
            const key = `${state.currentNum}_${state.currentPageIndex}`;
            elements.inputCustomUrl.value = state.customUrls[key] || state.customUrls[state.currentNum] || '';
            elements.urlModal.classList.remove('hidden');
        });

        elements.btnCloseModal.addEventListener('click', () => {
            elements.urlModal.classList.add('hidden');
        });

        elements.btnSaveUrl.addEventListener('click', () => {
            const url = elements.inputCustomUrl.value.trim();
            const key = `${state.currentNum}_${state.currentPageIndex}`;
            if (url) {
                state.customUrls[key] = url;
            } else {
                delete state.customUrls[key];
            }
            localStorage.setItem('amis_custom_urls', JSON.stringify(state.customUrls));
            elements.urlModal.classList.add('hidden');
            selectSong(state.currentNum, state.currentPageIndex);
        });

        elements.btnResetUrl.addEventListener('click', () => {
            const key = `${state.currentNum}_${state.currentPageIndex}`;
            delete state.customUrls[key];
            delete state.customUrls[state.currentNum];
            localStorage.setItem('amis_custom_urls', JSON.stringify(state.customUrls));
            elements.inputCustomUrl.value = '';
            elements.urlModal.classList.add('hidden');
            selectSong(state.currentNum, state.currentPageIndex);
        });

        elements.btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            if (e.key === 'ArrowLeft') {
                navigateSong(-1);
            } else if (e.key === 'ArrowRight') {
                navigateSong(1);
            } else if (e.key === 'ArrowUp') {
                switchPage(-1);
            } else if (e.key === 'ArrowDown') {
                switchPage(1);
            } else if (e.key === '+' || e.key === '=') {
                zoom(0.2);
            } else if (e.key === '-') {
                zoom(-0.2);
            } else if (e.key === '0') {
                resetZoom();
            }
        });

        function initFromHash() {
            const hash = window.location.hash.replace('#', '');
            const targetNum = parseInt(hash, 10);
            if (!isNaN(targetNum)) {
                const found = songsData.find(s => s.num === targetNum);
                if (found) return targetNum;
            }
            return 311;
        }

        renderSongList();
        const initialNum = initFromHash();
        selectSong(initialNum, 0);
    </script>
</body>
</html>
